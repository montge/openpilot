# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Fork policy (montge/openpilot): upstream commaai/openpilot owns pyproject.toml,
# uv.lock, and all submodule pins — those update via upstream syncs, not fork-local
# dependabot PRs (upstream runs its own package-update bot). Only GitHub Actions
# versions are checked here, since the fork carries its own workflows
# (codecov, sonarcloud, misra, nvidia-compat, ...) that upstream never touches.

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
