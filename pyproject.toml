[project]
name = "openpilot"
requires-python = ">= 3.12.3, < 3.13"
license = {text = "MIT License"}
version = "0.1.0"
description = "an open source driver assistance system"
authors = [
  {name = "Vehicle Researcher", email="user@comma.ai"}
]

# ------------------------------------------
# > this dependencies list *only* goes down.
# ------------------------------------------
# Linux and Python is all we need, otherwise
# we write and own the lines ourselves.
# ------------------------------------------
dependencies = [
  # multiple users
  "sounddevice",  # micd + soundd
  "requests",     # many one-off uses
  "tqdm",         # cars (fw_versions.py) on start + many one-off uses

  # core
  "scons",
  "pycapnp==2.1.0",  # 2.2 introduces a memory leak due to cyclic references
  "numpy >=2.0",

  # vendored native dependencies
  "comma-deps-capnproto",
  "comma-deps-acados",
  "comma-deps-ffmpeg",
  "comma-deps-zstd",
  "comma-deps-zeromq",
  "comma-deps-json11",
  "comma-deps-git-lfs",
  "comma-deps-gcc-arm-none-eabi",

  # athena
  "PyJWT[crypto]",
  "websocket_client",

  # joystickd
  "inputs",

  # these should be removed
  "pyzmq",
  "setproctitle",
  "jeepney",
  "zstandard",  # this can go once we're on Python 3.14+

  # ui
  "comma-deps-raylib",
]

[project.optional-dependencies]
testing = [
  "coverage",   # line coverage
  "ty",         # type checking
  "ruff",       # linting
  "codespell",  # spellcheck

  # fork: upstream dropped pytest for a unittest-based harness (openpilot/common/test.py).
  # The fork keeps pytest as its runner -- it executes upstream's OpenpilotTestCase
  # classes natively while still running the fork's own pytest-style suites, and the
  # fork's coverage/Sonar/codecov gates are all built on pytest-cov.
  "hypothesis ==6.47.*",
  "pytest",
  "pytest-cov",
  "pytest-subtests",
  "pytest-timeout",
  # https://github.com/pytest-dev/pytest-xdist/pull/1229
  "pytest-xdist @ git+https://github.com/sshane/pytest-xdist@2b4372bd62699fb412c4fe2f95bf9f01bd2018da",
  "pytest-mock",
  "pre-commit-hooks",
]

dev = [
  "matplotlib",
  "opencv-python-headless",  # fork: used by fair/shadow tooling
]

tools = [
  "matplotlib",

  "comma-deps-imgui",
  "comma-deps-bootstrap-icons",
  "comma-deps-libusb",
  "comma-deps-ncurses",

  # this can be added back once it's stripped down some more
  #"metadrive-simulator @ git+https://github.com/commaai/metadrive.git@minimal ; (platform_machine != 'aarch64')",
]

submodules = [
  "msgq",
  "opendbc",
  "pandacan",
  "rednose",
  "teleoprtc",
  "tinygrad",
]

[project.urls]
Homepage = "https://github.com/commaai/openpilot"

[dependency-groups]
standalone = [
  "openpilot[submodules]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "openpilot",
]

[tool.hatch.metadata]
allow-direct-references = true

# fork: upstream removed this section along with pytest; the fork keeps pytest as
# its test runner, so the config lives here as fork-owned.
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-Werror --strict-config --strict-markers --durations=10 -n auto --dist=loadgroup"
python_files = "test_*.py"
markers = [
  "slow: tests that take awhile to run and can be skipped with -m 'not slow'",
  "nocapture: don't capture test output",
  "shared_download_cache: share download cache between tests",
  "xdist_group_class_property: group tests by a property of the class that contains them",
]
testpaths = [
  "openpilot",
]

[tool.codespell]
quiet-level = 3
# if you've got a short variable name that's getting flagged, add it here
ignore-words-list = "bu,ro,te,ue,alo,hda,ois,nam,nams,ned,som,parm,setts,inout,warmup,bumb,nd,sie,preints,whit,indexIn,ws,uint,grey,deque,stdio,amin,BA,LITE,atEnd,UIs,errorString,arange,FocusIn,od,tim,relA,hist,copyable,jupyter,thead,TGE,abl,lite,ser"
builtin = "clear,rare,informal,code,names,en-GB_to_en-US"
skip = "*.po, uv.lock, *.onnx, *.pem, */c_generated_code/*, docs/assets/*, openpilot/tools/plotjuggler/layouts/*, openpilot/selfdrive/assets/offroad/mici_fcc.html"

# https://docs.astral.sh/ruff/configuration/#using-pyprojecttoml
[tool.ruff]
indent-width = 2
lint.select = [
  "E", "F", "W", "PIE", "C4", "ISC", "A", "B",
  "NPY", # numpy
  "UP",  # pyupgrade
  "ASYNC",
  "B904", "B905",
  "PLC0207",
  "TRY203", "TRY400", "TRY401", # try/excepts
  "RUF006", "RUF008", "RUF009", "RUF061", "RUF064", "RUF100", "RUF102", "RUF103", "RUF104",
  "TID251",
  "PLE", "PLR1704",
]
lint.ignore = [
  "E741",
  "E402",
  "B027",
  "UP007",  # this doesn't play nice with raylib atm
]
line-length = 160
lint.flake8-implicit-str-concat.allow-multiline = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.time".msg = "Use time.monotonic. time.time can skip due to its reference clock, you probably want a monotonic clock"
"pyray.measure_text_ex".msg = "Use openpilot.system.ui.lib.text_measure"
"pyray.is_mouse_button_pressed".msg = "This can miss events. Use Widget._handle_mouse_press"
"pyray.is_mouse_button_released".msg = "This can miss events. Use Widget._handle_mouse_release"
"pyray.draw_text".msg = "Use a function (such as rl.draw_font_ex) that takes font as an argument"
"pyray.draw_texture".msg = "Use rl.draw_texture_ex for float position support"

# fork: upstream used to ignore NPY002 repo-wide ("new numpy random syntax is worse")
# and has since dropped that ignore. The fork's numpy-heavy tooling below still uses the
# legacy np.random API in ~230 places. Migrating to np.random.Generator changes the random
# streams, which would re-baseline the deterministic harness/benchmark results these
# modules assert on -- worth doing deliberately, not as a side effect of an upstream sync.
[tool.ruff.lint.per-file-ignores]
"openpilot/selfdrive/controls/lib/tests/algorithm_harness/*" = ["NPY002"]
"openpilot/selfdrive/controls/lib/trackers/*" = ["NPY002"]
"openpilot/selfdrive/modeld/fair/*" = ["NPY002"]
"openpilot/tools/dgx/*" = ["NPY002"]
"openpilot/tools/fair/*" = ["NPY002"]
"openpilot/tools/stonesoup/*" = ["NPY002"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ty.rules]
unresolved-import = "ignore"  # Cython-compiled modules (.pyx)
unresolved-attribute = "ignore"  # many from capnp and Cython modules

# fork: upstream used to ignore these six rules repo-wide; it has since cleaned its own
# code and dropped the blanket ignores, which is the stricter (and better) default we now
# inherit for all shared code. The fork's own numpy/torch-heavy tooling below has never
# satisfied them -- these are dynamic-typing false positives plus real annotation debt.
# Scoped here so upstream's strictness still applies everywhere else. Cleaning these up
# is tracked as follow-up work, not part of the sync.
[[tool.ty.overrides]]
include = [
  "openpilot/selfdrive/controls/lib/tests/algorithm_harness",
  "openpilot/selfdrive/controls/lib/trackers",
  "openpilot/tools/algo_bench.py",
  "openpilot/tools/dgx",
  "openpilot/tools/fair",
  "openpilot/tools/shadow",
  "openpilot/tools/stonesoup",
]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
not-subscriptable = "ignore"
call-non-callable = "ignore"
unsupported-operator = "ignore"
no-matching-overload = "ignore"

[tool.uv]
python-preference = "only-managed"
default-groups = ["standalone"]
override-dependencies = [
  "opendbc",  # panda pins opendbc from git for standalone use; always use our submodule
]

[tool.uv.sources]
msgq = { path = "msgq_repo", editable = true }
opendbc = { path = "opendbc_repo", editable = true }
pandacan = { path = "panda", editable = true }
rednose = { path = "rednose_repo", editable = true }
teleoprtc = { path = "teleoprtc_repo", editable = true }
tinygrad = { path = "tinygrad_repo", editable = true }
